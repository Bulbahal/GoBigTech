name: Go Tests
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
      - name: Run tests across all modules
      run: |
       for mod in $(find . -name "go.mod"); do
         dir=$(dirname "$mod")
         echo "=== Testing module in $dir ==="
         (cd "$dir" && go test -race -v ./...) || exit 1
       done
